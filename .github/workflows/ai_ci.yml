name: Python AI CI / RAG Benchmarking

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: uv sync

      - name: Code Style Check (Ruff Lint)
        run: uv run ruff check .

      - name: Run Pytest & Latency Benchmarks
        run: uv run pytest
