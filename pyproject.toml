[project]
name = "kms-core-ai"
version = "0.1.0"
description = "Core AI RAG Engine microservice for Automotive Documentation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic[email]>=2.6.4",
    "pydantic-settings>=2.2.1",
    "requests>=2.31.0",
    "openai>=1.14.1",
    "chromadb>=0.4.24",
    "pypdf>=4.1.0",
    "pymupdf>=1.24.0",
    "rapidocr-onnxruntime>=1.3.24",
    "tiktoken>=0.6.0",
    "boto3>=1.34.0",
    "opensearch-py>=2.4.0",
    "requests-aws4auth>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "ruff>=0.3.3",
]

[tool.ruff.lint.per-file-ignores]
# solve_problem.py is intentionally kept in sync with the reference repo.
# Legacy typing and Vietnamese strings are preserved by design.
"src/pipelines/solve_problem.py" = ["I001", "UP035", "UP006", "F401", "F541", "TRY201", "BLE001"]
"src/pipelines/ingest.py" = ["BLE001", "S110", "F821", "TRY201", "SIM113", "SIM114"]
"src/pipelines/bedrock_rag.py" = ["BLE001"]
"src/core/aws_client.py" = ["TRY201", "BLE001"]
"src/core/answer_generator.py" = ["BLE001", "TRY201"]
"src/utils/opensearch_utils.py" = ["TRY201", "BLE001"]
"src/pipelines/chunker.py" = ["SIM113"]



[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*"
]
